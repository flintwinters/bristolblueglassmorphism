<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapis Glass UI</title>
    <style>
        :root {
            /* Colors */
            --color-background-image: url('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?auto=format&fit=crop&w=1920&q=80');
            --color-glass-blue: rgba(32, 20, 150, 0.4);
            --color-border-highlight: rgba(160, 160, 255, 0.2);
            --color-border-shadow: rgba(10, 5, 80, 0.1);
            --color-shadow-outer: rgba(0, 0, 0, 0.4);
            --color-shadow-inner: rgba(0, 0, 0, 0.2);
            --color-dot-background: rgba(255, 255, 255, 0.1);
            --color-shadow-highlight: rgba(255, 255, 255, 0.3);
            --color-button-background: rgba(32, 20, 150, 0.2);
            --color-button-shadow-highlight: rgba(255, 255, 255, 0.2);
            --color-button-shadow-dark: rgba(0, 0, 0, 0.2);
            --color-text: rgba(255, 255, 255, 0.7);
            --color-outline: rgba(160, 160, 255, 0.1);
            --color-outline-dark: rgba(0, 0, 100, 0.1);

            /* Sizing */
            --size-border-width: 2px;
            --size-body-gap: 40px;
            --size-panel-width: 320px;
            --size-panel-height: 580px;
            --size-panel-border-radius: 24px;
            --size-panel-padding: 30px;
            --size-panel-gap: 20px;
            --size-header-dots-gap: 8px;
            --size-header-dots-margin-bottom: 20px;
            --size-dot: 12px;
            --size-dot-border-width: 2px;
            --size-dot-border-radius: 50%;
            --size-button-height: 60px;
            --size-button-border-radius: 12px;
            --size-button-padding-x: 15px;
            --size-grid-gap: 20px;
            --size-square-button-font: 24px;
            --size-square-button-aspect-ratio: 1/1;
            --grid-template-columns: 1fr 1fr;
            --z-index-dragging: 1000;

            /* Outline properties */
            --size-outline-width: 2px;
            --size-outline-offset: 1px;

            /* Individual Outline properties */
            --size-outline-top-width: 6px;
            --size-outline-right-width: var(--size-outline-width);
            --size-outline-bottom-width: 6px;
            --size-outline-left-width: 6px;
            
            --color-outline-top: var(--color-outline);
            --color-outline-right: var(--color-outline);
            --color-outline-bottom: var(--color-outline-dark);
            --color-outline-left: var(--color-outline-dark);

            --size-outline-top-offset: var(--size-outline-offset);
            --size-outline-right-offset: var(--size-outline-offset);
            --size-outline-bottom-offset: var(--size-outline-offset);
            --size-outline-left-offset: var(--size-outline-offset);

            /* Effects */
            --effect-backdrop-blur: blur(6px) saturate(120%);
            --effect-webkit-backdrop-blur: blur(6px) saturate(120%);
            --effect-panel-box-shadow: 
                0 20px 50px var(--color-shadow-outer),
                0 5px 10px var(--color-shadow-outer),
                1px 1px 2px var(--color-shadow-highlight),
                inset 1px 1px 3px var(--color-shadow-highlight),
                inset 0 0 15px var(--color-shadow-inner),
                inset 0 0 20px var(--color-shadow-highlight);
            --effect-button-box-shadow: 
                0 5px 10px var(--color-shadow-outer),
                inset 2px 2px 2px var(--color-button-shadow-highlight),
                inset -2px -2px 2px var(--color-button-shadow-dark);
            --effect-square-button-box-shadow: 
                0 5px 10px var(--color-shadow-outer),
                inset 1px 1px 2px var(--color-button-shadow-highlight),
                inset -1px -1px 2px var(--color-button-shadow-dark);

            /* Fonts */
            --font-family-main: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: var(--color-background-image) center/cover no-repeat;
            font-family: var(--font-family-main);
            display: flex;
            gap: var(--size-body-gap);
            justify-content: center;
            align-items: center;
        }

        .glass-panel {
            width: var(--size-panel-width);
            height: var(--size-panel-height);
            background: var(--color-glass-blue);
            backdrop-filter: var(--effect-backdrop-blur);
            filter: url(#noiseFilter);
            -webkit-backdrop-filter: var(--effect-webkit-backdrop-blur);
            border-radius: var(--size-panel-border-radius);
            border-top:     var(--size-border-width) solid var(--color-border-highlight);
            border-left:    var(--size-border-width) solid var(--color-border-highlight);
            border-right:   var(--size-border-width) solid var(--color-border-shadow);
            border-bottom:  var(--size-border-width) solid var(--color-border-shadow);
            box-shadow: var(--effect-panel-box-shadow);
            padding: var(--size-panel-padding);
            cursor: grab;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: var(--size-panel-gap);
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            pointer-events: none;
            top: calc(-1 * var(--size-outline-top-offset));
            left: calc(-1 * var(--size-outline-left-offset));
            right: calc(-1 * var(--size-outline-right-offset));
            bottom: calc(-1 * var(--size-outline-bottom-offset));
            border-top: var(--size-outline-top-width) solid var(--color-outline-top);
            border-right: var(--size-outline-right-width) solid var(--color-outline-right);
            border-bottom: var(--size-outline-bottom-width) solid var(--color-outline-bottom);
            border-left: var(--size-outline-left-width) solid var(--color-outline-left);
            border-radius: calc(var(--size-panel-border-radius) + var(--size-outline-offset));
        }

        .glass-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: inherit;
            pointer-events: none;
            filter: url(#noiseFilter);
            opacity: 0.07;
        }

        .glass-panel.dragging {
            z-index: var(--z-index-dragging);
        }

        .glass-panel:active { cursor: grabbing; }

        .header-dots {
            display: flex;
            gap: var(--size-header-dots-gap);
            margin-bottom: var(--size-header-dots-margin-bottom);
        }

        .dot {
            width: var(--size-dot);
            height: var(--size-dot);
            border-radius: var(--size-dot-border-radius);
            background: var(--color-dot-background);
            border: var(--size-dot-border-width) solid var(--color-border-highlight);
        }

        .neu-button {
            height: var(--size-button-height);
            background: var(--color-button-background);
            border-radius: var(--size-button-border-radius);
            border-top:     var(--size-border-width) solid var(--color-border-highlight);
            border-left:    var(--size-border-width) solid var(--color-border-highlight);
            border-right:   var(--size-border-width) solid var(--color-border-shadow);
            border-bottom:  var(--size-border-width) solid var(--color-border-shadow);
            box-shadow: var(--effect-button-box-shadow);
            display: flex;
            align-items: center;
            padding: 0 var(--size-button-padding-x);
            color: var(--color-text);
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: var(--grid-template-columns);
            gap: var(--size-grid-gap);
        }

        .square-btn {
            aspect-ratio: var(--size-square-button-aspect-ratio);
            background: var(--color-button-background);
            border-radius: var(--size-button-border-radius);
            border-top:     var(--size-border-width) solid var(--color-border-highlight);
            border-left:    var(--size-border-width) solid var(--color-border-highlight);
            border-right:   var(--size-border-width) solid var(--color-border-shadow);
            border-bottom:  var(--size-border-width) solid var(--color-border-shadow);
            box-shadow: var(--effect-square-button-box-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--color-text);
            font-size: var(--size-square-button-font);
            position: relative;
        }

        .neu-button::before,
        .square-btn::before {
            content: '';
            position: absolute;
            pointer-events: none;
            top: calc(-1 * var(--size-outline-top-offset));
            left: calc(-1 * var(--size-outline-left-offset));
            right: calc(-1 * var(--size-outline-right-offset));
            bottom: calc(-1 * var(--size-outline-bottom-offset));
            border-top: var(--size-outline-top-width) solid var(--color-outline-top);
            border-right: var(--size-outline-right-width) solid var(--color-outline-right);
            border-bottom: var(--size-outline-bottom-width) solid var(--color-outline-bottom);
            border-left: var(--size-outline-left-width) solid var(--color-outline-left);
            border-radius: calc(var(--size-button-border-radius) + var(--size-outline-offset));
        }
    </style>
</head>
<body>


    <div class="glass-panel" id="panel1">
        <div class="header-dots">
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="neu-button">⚙️ Search Settings</div>
        <div class="grid">
            <div class="square-btn"></div>
            <div class="square-btn"></div>
            <div class="square-btn"></div>
            <div class="square-btn"></div>
        </div>
    </div>

    <div class="glass-panel" id="panel2">
        <div class="header-dots">
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="neu-button"></div>
    </div>

    <script>
        const panels = document.querySelectorAll('.glass-panel');
        
        panels.forEach(panel => {
            let offsetX, offsetY, isDragging = false;

            panel.addEventListener('mousedown', (e) => {
                isDragging = true;
                panel.classList.add('dragging');
                offsetX = e.clientX - panel.getBoundingClientRect().left;
                offsetY = e.clientY - panel.getBoundingClientRect().top;
                panel.style.position = 'absolute';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panel.style.left = `${e.clientX - offsetX}px`;
                panel.style.top = `${e.clientY - offsetY}px`;
                panel.style.margin = '0';
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                panel.classList.remove('dragging');
            });
        });
    </script>
</body>
</html>
